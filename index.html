<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFFL 2026 Power Rankings</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1f24; color: #e8ecef; font-family: Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header {
    position: relative; z-index: 5; flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.7rem 1rem; background: #1b1f24; border-bottom: 3px solid #F47321;
  }
  h1 { margin: 0; font-size: 0.95rem; letter-spacing: 0.14em; color: #3ecf8e; }
  .slicer { display: flex; align-items: center; gap: 0.6rem; }
  .slicer span { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; color: #3ecf8e; }
  select {
    color-scheme: dark;
    height: 36px; min-width: 9.5rem;
    color: #e8ecef; background: #262c33; border: 2px solid #F47321; border-radius: 6px;
    font: 700 16px/1 Helvetica, Arial, sans-serif;
    padding: 0 8px; cursor: pointer;
  }
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #1b1f24; }
  iframe {
    position: absolute; top: 0; left: 0; border: 0; background: #1b1f24;
    transform-origin: 0 0;
  }
</style>
</head>
<body>
<header>
  <h1>SFFL</h1>
  <label class="slicer">
    <span>WEEK</span>
    <select id="week-pick" aria-label="Week">
      <option value="2026/Write Ups/week_1/SFFL_2026_Week_1_Power_Rankings.pdf">Week 1</option>
      <option value="2026/Write Ups/week_2/SFFL_2026_Week_2_Power_Rankings.html">Week 2</option>
      <option value="2026/Write Ups/week_3/SFFL_2026_Week_3_Power_Rankings.html">Week 3</option>
      <option value="2026/Write Ups/week_4/SFFL_2026_Week_4_Power_Rankings.html">Week 4</option>
      <option value="2026/Write Ups/week_5_6/SFFL_2026_Weeks_5_6_Power_Rankings.html">Weeks 5–6</option>
      <option value="2026/Write Ups/week_7/SFFL_2026_Week_7_Power_Rankings.html">Week 7</option>
      <option value="2026/Write Ups/week_8/SFFL_2026_Week_8_Power_Rankings.html">Week 8</option>
      <option value="2026/Write Ups/week_9/SFFL_2026_Week_9_Power_Rankings.html" selected>Week 9</option>
    </select>
  </label>
</header>
<div id="stage">
  <iframe id="sheet" title="Power rankings" scrolling="no" src="2026/Write%20Ups/week_9/SFFL_2026_Week_9_Power_Rankings.html"></iframe>
</div>
<script>
const pick = document.getElementById("week-pick");
const frame = document.getElementById("sheet");
const stage = document.getElementById("stage");
const PAPER = { w: 11 * 96, h: 8.5 * 96 };

function sheetSrc(value) {
  const src = value.split(" ").join("%20");
  return src.toLowerCase().endsWith(".pdf") ? src + "#view=Fit&toolbar=0" : src;
}

function fitSheet() {
  if (!stage.clientWidth || !stage.clientHeight) return;
  const pdf = frame.src.toLowerCase().includes(".pdf");
  let pageW = PAPER.w;
  let pageH = PAPER.h;
  if (!pdf) {
    try {
      const page = frame.contentDocument && frame.contentDocument.querySelector(".page");
      if (page && page.offsetWidth && page.offsetHeight) {
        pageW = page.offsetWidth;
        pageH = page.offsetHeight;
      }
    } catch (e) {}
  }
  if (pdf) {
    frame.setAttribute("scrolling", "auto");
    frame.style.width = "100%";
    frame.style.height = "100%";
    frame.style.transform = "none";
    return;
  }
  frame.setAttribute("scrolling", "no");
  frame.style.width = pageW + "px";
  frame.style.height = pageH + "px";
  const scale = Math.min(stage.clientWidth / pageW, stage.clientHeight / pageH);
  const x = (stage.clientWidth - pageW * scale) / 2;
  const y = (stage.clientHeight - pageH * scale) / 2;
  frame.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
}

function openWeek(index) {
  pick.selectedIndex = index;
  const next = sheetSrc(pick.options[index].value);
  if (frame.getAttribute("src") !== next) frame.src = next;
  const slug = pick.options[index].textContent.replace("Weeks ", "").replace("Week ", "").replace("–", "-");
  history.replaceState(null, "", "#week-" + slug);
  fitSheet();
}

pick.addEventListener("change", () => openWeek(pick.selectedIndex));
frame.addEventListener("load", fitSheet);
window.addEventListener("resize", fitSheet);
const hash = decodeURIComponent(location.hash.replace("#week-", ""));
const start = [...pick.options].findIndex((option) => {
  const slug = option.textContent.replace("Weeks ", "").replace("Week ", "").replace("–", "-");
  return slug === hash;
});
openWeek(start === -1 ? pick.options.length - 1 : start);
</script>
</body>
</html>
